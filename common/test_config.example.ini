[TEST_CONFIG]
url = https://axcoin-backend-dev.onrender.com/api/v1
token_cache_file = .axcoin-token-cache.json
refresh_before_seconds = 60

# 复制本文件为 test_config.ini，再把邮箱改为实际测试账号。
# 密码和验证码只保存到环境变量，不要写进 INI 或提交到 GitHub。

[ROLE_admin]
email = admin-user@example.com
password_env = AXCOIN_ADMIN_PASSWORD
two_factor_code_env = AXCOIN_ADMIN_2FA_CODE

[ROLE_Submitter]
email = submitter@example.com
password_env = AXCOIN_SUBMITTER_PASSWORD
two_factor_code_env = AXCOIN_SUBMITTER_2FA_CODE

[ROLE_approver]
email = approver@example.com
password_env = AXCOIN_APPROVER_PASSWORD
two_factor_code_env = AXCOIN_APPROVER_2FA_CODE

[ROLE_Viewer]
email = viewer@example.com
password_env = AXCOIN_VIEWER_PASSWORD
two_factor_code_env = AXCOIN_VIEWER_2FA_CODE

[ROLE_root_admin]
email = root-admin@example.com
password_env = AXCOIN_ROOT_ADMIN_PASSWORD
two_factor_code_env = AXCOIN_ROOT_ADMIN_2FA_CODE

[ROLE_sales]
email = sales@example.com
password_env = AXCOIN_SALES_PASSWORD
two_factor_code_env = AXCOIN_SALES_2FA_CODE

[ROLE_operator]
email = operator@example.com
password_env = AXCOIN_OPERATOR_PASSWORD
two_factor_code_env = AXCOIN_OPERATOR_2FA_CODE

[ROLE_compliance]
email = compliance@example.com
password_env = AXCOIN_COMPLIANCE_PASSWORD
two_factor_code_env = AXCOIN_COMPLIANCE_2FA_CODE

